name: Fix trailing newlines
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-newlines.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove trailing newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path("package.json"), Path(".makefun/owner.json")):
              data = p.read_bytes()
              p.write_bytes(data.rstrip(b"\n"))
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "Rahulboss7788"
          git config user.email "bindujitop@gmail.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Remove trailing newlines from package.json and owner.json"
          git push
